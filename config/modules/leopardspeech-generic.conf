GenericExecuteSynth \
"retro-tts --persistent --engine leopardspeech --voice \'$VOICE\' --rate $RATE --pitch $PITCH --text \'$DATA\'"
GenericCmdDependency "retro-tts"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"
AddVoice "en" "MALE1" "Alex"
AddVoice "en" "FEMALE1" "Vicki"
AddVoice "en" "MALE2" "Fred"
AddVoice "en" "MALE3" "Bruce"
AddVoice "en" "FEMALE2" "Victoria"
DefaultVoice "Alex"
GenericDefaultCharset "utf-8"
GenericRateForceInteger 1
GenericPitchForceInteger 1
GenericRateAdd 50
GenericPitchAdd 50
GenericRateMultiply 50
GenericPitchMultiply 50
