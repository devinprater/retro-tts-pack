GenericExecuteSynth \
"retro-tts --persistent --engine smoothtalker --rate $RATE --pitch $PITCH --text \'$DATA\'"

GenericCmdDependency "retro-tts"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"
GenericStripPunctChars ""
AddVoice "en" "MALE1" "smoothtalker"
DefaultVoice "smoothtalker"
GenericDefaultCharset "utf-8"
GenericRateForceInteger 1
GenericPitchForceInteger 1
GenericRateAdd 50
GenericPitchAdd 50
GenericRateMultiply 50
GenericPitchMultiply 50
